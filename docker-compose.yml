services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  api:
    build: ./server
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      MONGO_URI: mongodb://mongo:27017/dynamic-namecard
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      UPLOAD_DIR: /data/uploads
      ORIGINALS_DIR: /data/originals
      VIDEO_CRF: ${VIDEO_CRF:-26}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      DEFAULT_CREATE_LINK: ${DEFAULT_CREATE_LINK:-https://t.me/AddmycoBot}
      DEFAULT_CONTACT_EMAIL: ${DEFAULT_CONTACT_EMAIL:-Office@addmy.co}
    volumes:
      - uploads_data:/data/uploads
      - originals_data:/data/originals

  web:
    build: ./client
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  mongo_data:
  uploads_data:
  originals_data:
